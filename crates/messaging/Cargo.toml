[package]
name = "messaging"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
async-nats = "0.38"
futures-util = "0.3"
rdkafka = { version = "0.37", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "v7"] }
