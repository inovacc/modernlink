[workspace]
members = [
    "crates/analyzer",
    "crates/git",
    "crates/harness",
    "crates/inference",
    "crates/model",
    "crates/modernlink-cli",
    "crates/runtime-observer",
    "crates/state",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
gix = "0.87.0"
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tree-sitter = "0.26.13"
tree-sitter-java = "0.23.5"
