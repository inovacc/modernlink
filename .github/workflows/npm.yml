name: npm distribution

on:
  pull_request:
    paths: ["npm/**", ".github/workflows/npm.yml", ".github/scripts/package_npm_platform.mjs"]
  push:
    branches: [main]
    paths: ["npm/**", ".github/workflows/npm.yml", ".github/scripts/package_npm_platform.mjs"]
  workflow_dispatch:
    inputs:
      version:
        description: Exact npm version to publish for every platform package and wrapper.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - run: node --check npm/modernlink/bin/modernlink.js
      - working-directory: npm/modernlink
        run: npm pack --dry-run --json

  build-platform:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-wrapper
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            executable: cli/target/release/modernlink
          - runner: windows-latest
            platform: win32
            arch: x64
            executable: cli/target/release/modernlink.exe
          - runner: macos-13
            platform: darwin
            arch: x64
            executable: cli/target/release/modernlink
          - runner: macos-latest
            platform: darwin
            arch: arm64
            executable: cli/target/release/modernlink
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - name: Build Rust CLI
        working-directory: cli
        run: cargo build -p modernlink-cli --release
      - name: Build platform npm package
        run: node .github/scripts/package_npm_platform.mjs ${{ matrix.platform }} ${{ matrix.arch }} ${{ inputs.version }} ${{ matrix.executable }} dist/npm-platform
      - uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/npm-platform

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: build-platform
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with: { path: dist/platforms }
      - name: Publish platform packages
        env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for publication"; exit 1; }
          for package in dist/platforms/*; do
            npm pkg set private=false --prefix "$package"
            npm publish "$package" --access public --provenance
          done
      - name: Publish wrapper after platform packages
        env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
        run: |
          VERSION="${{ inputs.version }}" node -e 'const fs=require("fs"); const p="npm/modernlink/package.json"; const j=JSON.parse(fs.readFileSync(p)); j.version=process.env.VERSION; j.private=false; for (const k of Object.keys(j.optionalDependencies)) j.optionalDependencies[k]=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(j, null, 2)+"\n")'
          npm publish npm/modernlink --access public --provenance
