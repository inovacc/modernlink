name: Snapshot JAR

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'docker/java6/Dockerfile'
      - 'java/**'
      - '.github/workflows/snapshot.yml'
  workflow_dispatch:

jobs:
  snapshot:
    name: Build snapshot JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build -f docker/java6/Dockerfile -t modernlink-java6-https .
      - name: Extract JAR
        run: |
          container_id=$(docker create modernlink-java6-https)
          trap 'docker rm "$container_id"' EXIT
          docker cp "$container_id:/workspace/modernlink.jar" modernlink-snapshot.jar
      - uses: actions/upload-artifact@v4
        with:
          name: modernlink-snapshot-${{ github.sha }}
          path: modernlink-snapshot.jar
