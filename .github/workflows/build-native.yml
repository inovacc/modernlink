name: Build Native JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'docker/java6/Dockerfile'
      - 'java/**'
      - '.github/workflows/build-native.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'docker/java6/Dockerfile'
      - 'java/**'

jobs:
  build:
    name: Build Java 6 distributable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build container
        run: docker build -f docker/java6/Dockerfile -t modernlink-java6-https .
      - name: Extract JAR
        run: |
          container_id=$(docker create modernlink-java6-https)
          trap 'docker rm "$container_id"' EXIT
          docker cp "$container_id:/workspace/modernlink.jar" modernlink.jar
      - uses: actions/upload-artifact@v7
        with:
          name: modernlink-java6-jar
          path: modernlink.jar
