name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # SC-02: no toolchain is installed here on purpose. rust-toolchain.toml is the
      # single source of truth, and the runner's rustup honours it — installing
      # `@stable` alongside it would download a second toolchain that never gets used
      # and would hide the pin rather than enforce it.
      - name: Show the pinned toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version
      # SC-07 split the gate in two. This half compiles NO broker client at all
      # (crates/messaging defaults to no providers), so it needs no system packages
      # and it is the half that fails fast.
      - name: Test workspace (default features, no broker client)
        run: cargo test --workspace
      - name: Check JNI crate
        run: cargo check -p jni-bridge
      # SC-04. Previously deferred because BACKLOG assumed these already passed; they
      # did not — clippy reported six findings, including two MutexGuards held across
      # an await point. Those are fixed, so the gate can be enforced from here on.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # BUGS B-001: rdkafka builds librdkafka from source via cmake and pulsar needs
      # protoc. Without these packages the job died on a missing curl/curl.h before the
      # test suite was ever reached. Kept in step with docker/java6/Dockerfile, which
      # carries the same recipe. As of SC-07 only the --all-features steps below need
      # them; the default gate above builds no native client.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libcurl4-openssl-dev libsasl2-dev protobuf-compiler
      # Gate coverage must not shrink because the default build got cheaper: every
      # provider transport is still compiled, tested and linted on every push. This
      # still does NOT reach a broker - the three broker-backed tests are #[ignore]d
      # (VER-01).
      - name: Test workspace (all providers)
        run: cargo test --workspace --all-features
      - name: Lint (all providers)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  java6-jar:
    name: Java 6 JAR integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Java 6 distributable JAR
        run: docker build -f docker/java6/Dockerfile -t modernlink-java6-https .
      # VER-05: the JAR is built here (the java:6b38-jdk base image is amd64-only) and
      # handed to the arm64 job below, which is the only way to load the linux-aarch64
      # native without an arm64 Java 6 image that does not exist.
      - name: Export the packaged JAR
        run: |
          container=$(docker create modernlink-java6-https)
          docker cp "$container":/workspace/modernlink.jar ./modernlink.jar
          docker rm "$container"
          ls -l modernlink.jar
      - uses: actions/upload-artifact@v7
        with:
          name: modernlink-jar
          path: modernlink.jar
          retention-days: 1
      # VER-03: run every test class from the packaged JAR - 15 of them. Previously only
      # three of ten ran, so a test the workflow did not name never executed. A class
      # added to java/src/test WITHOUT being named here still never runs, which is why
      # this list is exhaustive rather than a sample. None of them needs a broker.
      - name: Exercise packaged JAR
        run: |
          docker run --rm modernlink-java6-https sh -c '
            set -e
            for test in \
              NativeLoadSmokeTest \
              ModernUtilityStandaloneTest \
              LegacyHttpCapabilitiesTest \
              LegacyHttpRequestTest \
              LegacyHttpRequestConfigurationTest \
              LegacyHttpRequestRedirectTest \
              LegacyHttpResponseStructuredTest \
              LegacyHttpsTest \
              LegacyHttpsPostTest \
              ModernHttpsURLConnectionTest \
              ModernHttpsURLConnectionPostTest
            do
              echo "==== com.modernlink.$test"
              java -cp /workspace/modernlink.jar "com.modernlink.$test"
            done
            for test in LegacyJmsMessagingTest RoutingPolicyTest ProviderGuaranteesTest PayloadCategoriesTest
            do
              echo "==== com.modernlink.messaging.$test"
              java -cp /workspace/modernlink.jar "com.modernlink.messaging.$test"
            done
          '
      # VER-07: exercise the Java 6 contract fixture that BACKLOG names as an
      # acceptance criterion ("the Java 6 fixture registers a JMX metrics MBean").
      # It needs no broker. The other fixtures require a live NATS and stay out of
      # this job until VER-01 provides one.
      - name: Exercise the Java 6 JMX fixture
        run: |
          docker run --rm modernlink-java6-https sh -c '
            java -cp /workspace/modernlink.jar:/workspace/build/fixtures \
              com.modernlink.messaging.LegacyJmsJmxDemo TRANSPARENT LEGACY_JMS
          '

  broker-backed:
    name: Broker-backed messaging (VER-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # VER-01. Until now the three broker-backed tests existed but ran nowhere: they
      # are #[ignore]d, so every green CI run asserted exactly nothing about a real
      # broker, and the only evidence was one operator's manual run on one machine.
      #
      # `docker run` rather than `services:` on purpose - NATS needs the `-js` argument
      # to enable JetStream, and a service container cannot override the image command.
      # Mirrors .scripts/16-D_start_brokers.ps1 so local and CI runs stay comparable.
      - name: Start brokers
        run: |
          docker run -d --name ml-nats     -p 4222:4222 nats:2.10 -js
          docker run -d --name ml-rabbitmq -p 5672:5672 rabbitmq:3.13
      # Readiness is log-based, not port-based. RabbitMQ accepts a TCP connection well
      # before it will serve AMQP, so waiting on the port alone produces a flaky failure
      # that looks like a transport defect.
      - name: Wait for brokers
        run: |
          deadline=$(( $(date +%s) + 180 ))
          nats_ready=0; rabbit_ready=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$nats_ready" -eq 0 ] && docker logs ml-nats 2>&1 | grep -q 'Server is ready'; then
              nats_ready=1; echo "nats: ready"
            fi
            if [ "$rabbit_ready" -eq 0 ] && docker logs ml-rabbitmq 2>&1 | grep -q 'Server startup complete'; then
              rabbit_ready=1; echo "rabbitmq: ready"
            fi
            [ "$nats_ready" -eq 1 ] && [ "$rabbit_ready" -eq 1 ] && exit 0
            sleep 2
          done
          echo "::error::brokers did not become ready within 180s"
          docker logs ml-nats; docker logs ml-rabbitmq
          exit 1
      # Only the nats and rabbitmq features: both are pure Rust, so this job needs
      # neither cmake nor protoc. Kafka and Pulsar have no broker-backed test yet
      # (VER-02), which is why they are absent here rather than merely unstarted.
      - name: Broker-backed send/receive/ack
        env:
          MODERNLINK_NATS_URL: nats://127.0.0.1:4222
          MODERNLINK_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2f
        run: |
          set -o pipefail
          cargo test -p messaging --test broker_backed             --no-default-features --features nats,rabbitmq             -- --ignored --test-threads=1 2>&1 | tee broker-result.txt
      # A gate that can pass having run nothing is worse than no gate. cargo already
      # errors if the required features are missing, but this also catches a test being
      # renamed or dropped, which would otherwise shrink the gate silently.
      - name: Assert all three broker tests actually ran
        run: |
          grep -q 'test result: ok. 3 passed' broker-result.txt || {
            echo "::error::expected exactly 3 broker-backed tests to pass; see broker-result.txt"
            cat broker-result.txt
            exit 1
          }
      - name: Broker logs on failure
        if: failure()
        run: |
          echo "=== nats ==="; docker logs ml-nats
          echo "=== rabbitmq ==="; docker logs ml-rabbitmq

  broker-backed-kafka-pulsar:
    name: Broker-backed messaging - Kafka + Pulsar (VER-02, UNPROVEN)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Deliberately a SEPARATE job from `broker-backed`. Those three tests have passed
      # against live brokers; these two have never run anywhere. Keeping them apart
      # means a failure here cannot be mistaken for the NATS/RabbitMQ evidence breaking,
      # and the working evidence stays readable on its own.
      #
      # Expect this job to need tuning on its first real runs. That is the point of
      # landing it: a test that exists but runs nowhere proves nothing, and a red gate
      # here is a finding (docs/BUGS.md), not a mystery.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             cmake libcurl4-openssl-dev libsasl2-dev protobuf-compiler
      - name: Start Kafka (KRaft, single node)
        run: |
          docker run -d --name ml-kafka -p 9092:9092             -e KAFKA_NODE_ID=1             -e KAFKA_PROCESS_ROLES=broker,controller             -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093             -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092             -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER             -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT             -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093             -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1             -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1             -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1             -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0             apache/kafka:3.8.0
      - name: Start Pulsar (standalone)
        run: |
          docker run -d --name ml-pulsar -p 6650:6650             apachepulsar/pulsar:3.3.0 bin/pulsar standalone
      - name: Wait for brokers
        run: |
          deadline=$(( $(date +%s) + 300 ))
          kafka_ready=0; pulsar_ready=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if [ "$kafka_ready" -eq 0 ] && docker logs ml-kafka 2>&1 | grep -q 'Kafka Server started'; then
              kafka_ready=1; echo "kafka: ready"
            fi
            if [ "$pulsar_ready" -eq 0 ] && docker logs ml-pulsar 2>&1 | grep -q 'messaging service is ready'; then
              pulsar_ready=1; echo "pulsar: ready"
            fi
            [ "$kafka_ready" -eq 1 ] && [ "$pulsar_ready" -eq 1 ] && exit 0
            sleep 3
          done
          echo "::error::Kafka and/or Pulsar did not become ready within 300s"
          docker logs ml-kafka; docker logs ml-pulsar
          exit 1
      - name: Kafka send/receive/ack
        env:
          MODERNLINK_KAFKA_BROKERS: 127.0.0.1:9092
        run: |
          set -o pipefail
          cargo test -p messaging --test broker_backed_kafka             --no-default-features --features kafka             -- --ignored --test-threads=1 2>&1 | tee kafka-result.txt
          grep -q 'test result: ok. 1 passed' kafka-result.txt || {
            echo "::error::the Kafka broker-backed test did not run"; exit 1; }
      - name: Pulsar send/receive/ack
        env:
          MODERNLINK_PULSAR_URL: pulsar://127.0.0.1:6650
        run: |
          set -o pipefail
          cargo test -p messaging --test broker_backed_pulsar             --no-default-features --features pulsar             -- --ignored --test-threads=1 2>&1 | tee pulsar-result.txt
          grep -q 'test result: ok. 1 passed' pulsar-result.txt || {
            echo "::error::the Pulsar broker-backed test did not run"; exit 1; }
      - name: Broker logs on failure
        if: failure()
        run: |
          echo "=== kafka ==="; docker logs ml-kafka
          echo "=== pulsar ==="; docker logs ml-pulsar

  native-aarch64:
    name: linux-aarch64 native load (VER-05)
    runs-on: ubuntu-24.04-arm
    needs: java6-jar
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: modernlink-jar
      # VER-05. linux-aarch64 is the last of the three shipped natives never loaded on any
      # JVM: it is cross-compiled by cargo-zigbuild and shipped inside the JAR, and until
      # now nothing had ever called System.load on it. A native that has never been loaded
      # is an untested artifact being distributed to users.
      #
      # A MODERN JVM on purpose. There is no arm64 Java 6 image, and the question here is
      # whether the aarch64 .so loads and its JNI entry points return real values - the
      # same question windows-x86_64 was answered with on JVM 21. The Java 6 *language*
      # level is already proven by the amd64 job; this proves the aarch64 *binary*.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Load the aarch64 native and call across the boundary
        run: |
          set -o pipefail
          java -cp modernlink.jar com.modernlink.NativeLoadSmokeTest 2>&1 | tee smoke.txt
      # Without this the job could pass on an x86_64 runner having re-proved linux-x86_64
      # and learned nothing about aarch64 - a green gate asserting the wrong thing.
      - name: Assert it really ran on aarch64
        run: |
          grep -q 'native-smoke-platform=Linux/aarch64' smoke.txt || {
            echo "::error::this job did not run on aarch64; the result proves nothing about that native"
            cat smoke.txt
            exit 1
          }
          grep -q 'native-smoke=PASS' smoke.txt || {
            echo "::error::the aarch64 native did not load"; exit 1; }
