name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace
        run: cargo test --workspace
      - name: Check JNI crate
        run: cargo check -p jni

  java6-jar:
    name: Java 6 JAR integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Java 6 distributable JAR
        run: docker build -f docker/java6/Dockerfile -t modernlink-java6-https .
      - name: Exercise packaged JAR
        run: |
          docker run --rm modernlink-java6-https sh -c \
            "java -cp /workspace/modernlink.jar com.modernlink.LegacyHttpResponseStructuredTest && \
             java -cp /workspace/modernlink.jar com.modernlink.ModernHttpsURLConnectionTest && \
             java -cp /workspace/modernlink.jar com.modernlink.LegacyHttpsTest"
