name: Release JAR

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and attach JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build -f docker/java6/Dockerfile -t modernlink-java6-https .
      - name: Extract JAR
        run: |
          container_id=$(docker create modernlink-java6-https)
          trap 'docker rm "$container_id"' EXIT
          docker cp "$container_id:/workspace/modernlink.jar" modernlink.jar
      - uses: actions/upload-artifact@v4
        with:
          name: modernlink-${{ github.ref_name }}
          path: modernlink.jar
      - name: Attach JAR to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" modernlink.jar --clobber
